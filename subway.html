
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ANSHU GAMING - Subway Runner</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #070711;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  overflow-x: hidden;
  touch-action: manipulation;
}

header {
  padding: 15px;
  color: #39ffb6;
  font-size: 22px;
  font-weight: bold;
  text-shadow: 0 0 12px #39ffb6;
}

.game-container {
  width: 100%;
  max-width: 520px;
  margin: auto;
  padding: 8px;
}

.stats {
  display: flex;
  justify-content: space-around;
  gap: 8px;
  margin-bottom: 10px;
}

.stat {
  flex: 1;
  padding: 10px 5px;
  background: #15152a;
  border: 1px solid #39ffb6;
  border-radius: 8px;
  font-size: 13px;
}

.stat strong {
  display: block;
  color: #39ffb6;
  font-size: 19px;
  margin-top: 4px;
}

canvas {
  display: block;
  width: 100%;
  height: auto;
  background: #101024;
  border: 2px solid #39ffb6;
  border-radius: 12px;
  box-shadow: 0 0 18px #39ffb655;
  touch-action: none;
}

.controls {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 13px;
}

.control-btn, .action-btn {
  background: #17172b;
  color: #39ffb6;
  border: 1px solid #39ffb6;
  padding: 15px 5px;
  border-radius: 10px;
  font-size: 22px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
}

.control-btn:active, .action-btn:active {
  background: #39ffb6;
  color: #080812;
}

.action-controls {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.action-btn {
  flex: 1;
  font-size: 15px;
}

.instructions {
  margin: 16px 4px;
  color: #aaa;
  font-size: 13px;
  line-height: 1.8;
}

footer {
  padding: 15px;
  color: #39ffb6;
}
</style>
</head>

<body>

<header>⚡ ANSHU GAMING ⚡</header>

<div class="game-container">

  <div class="stats">
    <div class="stat">
      SCORE
      <strong id="score">0</strong>
    </div>
    <div class="stat">
      COINS
      <strong id="coins">0</strong>
    </div>
    <div class="stat">
      BEST
      <strong id="best">0</strong>
    </div>
  </div>

  <canvas id="game" width="420" height="620"></canvas>

  <div class="controls">
    <button class="control-btn" id="left">⬅️</button>
    <button class="control-btn" id="jump">⬆️ JUMP</button>
    <button class="control-btn" id="right">➡️</button>
  </div>

  <div class="action-controls">
    <button class="action-btn" id="slide">⬇️ SLIDE</button>
    <button class="action-btn" id="start">▶ START</button>
    <button class="action-btn" id="pause">⏸ PAUSE</button>
  </div>

  <p class="instructions">
    KEYBOARD: ← → Move | ↑ Jump | ↓ Slide<br>
    MOBILE: Swipe left/right/up/down or use buttons.<br>
    Avoid obstacles and collect coins!
  </p>

</div>

<footer>© 2026 ANSHU GAMING</footer>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

const $ = id => document.getElementById(id);

let lane = 1;
let playerY = 0;
let jumping = false;
let sliding = false;
let jumpTime = 0;
let slideTime = 0;

let objects = [];
let score = 0;
let coins = 0;
let speed = 5;
let spawnTimer = 0;
let frame = 0;

let running = false;
let gameOver = false;
let lastTime = 0;

let best = 0;
try {
  best = Number(localStorage.getItem("anshuRunnerBest")) || 0;
} catch(e) {}

$("best").textContent = best;

function laneX(n) {
  return 105 + n * 105;
}

function resetGame() {
  lane = 1;
  playerY = 0;
  jumping = false;
  sliding = false;
  jumpTime = 0;
  slideTime = 0;

  objects = [];
  score = 0;
  coins = 0;
  speed = 5;
  spawnTimer = 0;
  frame = 0;

  gameOver = false;
  running = true;

  updateStats();
  lastTime = performance.now();
  requestAnimationFrame(loop);
}

function updateStats() {
  $("score").textContent = score;
  $("coins").textContent = coins;
  $("best").textContent = best;
}

function moveLeft() {
  if (!running) return;
  lane = Math.max(0, lane - 1);
}

function moveRight() {
  if (!running) return;
  lane = Math.min(2, lane + 1);
}

function jump() {
  if (!running || jumping || sliding) return;
  jumping = true;
  jumpTime = 0;
}

function slide() {
  if (!running || jumping || sliding) return;
  sliding = true;
  slideTime = 0;
}

function spawnObjects() {
  const randomLane = Math.floor(Math.random() * 3);
  const chance = Math.random();

  if (chance < 0.4) {
    objects.push({
      type: "coin",
      lane: randomLane,
      y: -30
    });
  } else {
    const type = chance < 0.7 ? "block" :
                 chance < 0.88 ? "train" : "bar";

    objects.push({
      type,
      lane: randomLane,
      y: -65
    });
  }
}

function drawBackground() {
  const gradient = ctx.createLinearGradient(0, 0, 0, H);
  gradient.addColorStop(0, "#12122e");
  gradient.addColorStop(1, "#080812");

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, W, H);

  // Sky lights
  for (let i = 0; i < 15; i++) {
    ctx.fillStyle = "#ffffff";
    ctx.globalAlpha = 0.2;
    ctx.fillRect(
      (i * 73) % W,
      (i * 47) % 180,
      2, 2
    );
  }
  ctx.globalAlpha = 1;

  // Three tracks
  for (let i = 0; i < 3; i++) {
    const x = 55 + i * 105;

    ctx.fillStyle = "#17172d";
    ctx.fillRect(x, 0, 100, H);

    ctx.strokeStyle = "#454568";
    ctx.lineWidth = 4;

    ctx.beginPath();
    ctx.moveTo(x + 8, 0);
    ctx.lineTo(x + 8, H);
    ctx.moveTo(x + 92, 0);
    ctx.lineTo(x + 92, H);
    ctx.stroke();

    // Moving sleepers
    ctx.strokeStyle = "#383852";
    ctx.lineWidth = 3;

    for (let y = (frame * speed * 0.7) % 55 - 55;
         y < H; y += 55) {
      ctx.beginPath();
      ctx.moveTo(x + 10, y);
      ctx.lineTo(x + 90, y);
      ctx.stroke();
    }
  }

  // Neon side lights
  ctx.fillStyle = "#39ffb6";
  ctx.globalAlpha = 0.7;
  ctx.fillRect(48, 0, 3, H);
  ctx.fillRect(369, 0, 3, H);
  ctx.globalAlpha = 1;
}

function drawPlayer() {
  const x = laneX(lane);
  const y = 505 - playerY;

  ctx.save();

  if (sliding) {
    ctx.fillStyle = "#39ffb6";
    ctx.shadowColor = "#39ffb6";
    ctx.shadowBlur = 15;
    ctx.fillRect(x - 24, y + 15, 48, 27);

    ctx.fillStyle = "#f5c59c";
    ctx.beginPath();
    ctx.arc(x + 23, y + 12, 12, 0, Math.PI * 2);
    ctx.fill();
  } else {
    // Legs
    ctx.fillStyle = "#d5d5ff";
    ctx.fillRect(x - 13, y + 25, 10, 24);
    ctx.fillRect(x + 3, y + 25, 10, 24);

    // Shoes
    ctx.fillStyle = "#39ffb6";
    ctx.fillRect(x - 16, y + 44, 15, 7);
    ctx.fillRect(x + 1, y + 44, 15, 7);

    // Body
    ctx.shadowColor = "#39ffb6";
    ctx.shadowBlur = 16;
    ctx.fillStyle = "#39ffb6";
    ctx.fillRect(x - 19, y - 8, 38, 39);

    // Head
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#f2c49c";
    ctx.beginPath();
    ctx.arc(x, y - 23, 16, 0, Math.PI * 2);
    ctx.fill();

    // Hair
    ctx.fillStyle = "#25202b";
    ctx.beginPath();
    ctx.arc(x, y - 33, 15, Math.PI, 0);
    ctx.fill();

    // Eyes
    ctx.fillStyle = "#111";
    ctx.fillRect(x - 7, y - 25, 3, 3);
    ctx.fillRect(x + 4, y - 25, 3, 3);
  }

  ctx.restore();
}

function drawObjects() {
  objects.forEach(obj => {
    const x = laneX(obj.lane);
    const y = obj.y;

    if (obj.type === "coin") {
      ctx.save();
      ctx.shadowColor = "#ffd700";
      ctx.shadowBlur = 18;
      ctx.fillStyle = "#ffd700";
      ctx.beginPath();
      ctx.arc(x, y, 12, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#fff2a0";
      ctx.beginPath();
      ctx.arc(x - 4, y - 4, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    if (obj.type === "block") {
      ctx.fillStyle = "#ff4268";
      ctx.shadowColor = "#ff4268";
      ctx.shadowBlur = 12;
      ctx.fillRect(x - 25, y - 23, 50, 48);
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#fff";
      ctx.fillRect(x - 15, y - 12, 30, 5);
    }

    if (obj.type === "train") {
      ctx.fillStyle = "#8d4bff";
      ctx.shadowColor = "#8d4bff";
      ctx.shadowBlur = 12;
      ctx.fillRect(x - 34, y - 45, 68, 75);
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#9ffff0";
      ctx.fillRect(x - 24, y - 32, 48, 18);
    }

    if (obj.type === "bar") {
      ctx.fillStyle = "#ffad32";
      ctx.shadowColor = "#ffad32";
      ctx.shadowBlur = 12;
      ctx.fillRect(x - 38, y - 15, 76, 15);
      ctx.shadowBlur = 0;
    }
  });
}

function drawOverlay(title, subtitle) {
  ctx.fillStyle = "#000000bb";
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = "center";
  ctx.shadowColor = "#39ffb6";
  ctx.shadowBlur = 15;
  ctx.fillStyle = "#39ffb6";
  ctx.font = "bold 34px Arial";
  ctx.fillText(title, W / 2, 265);

  ctx.shadowBlur = 0;
  ctx.fillStyle = "white";
  ctx.font = "18px Arial";
  ctx.fillText(subtitle, W / 2, 310);
  ctx.font = "14px Arial";
  ctx.fillText("Press START to play", W / 2, 355);
}

function collisionCheck() {
  for (let i = objects.length - 1; i >= 0; i--) {
    const obj = objects[i];
    if (obj.passed) continue;

    if (obj.lane !== lane || obj.y < 465 || obj.y > 550) {
      continue;
    }

    if (obj.type === "coin") {
      coins++;
      score += 10;
      objects.splice(i, 1);
      continue;
    }

    let safe = false;

    if (obj.type === "block" && jumping && playerY > 35) {
      safe = true;
    }

    if (obj.type === "bar" && sliding) {
      safe = true;
    }

    if (!safe) {
      endGame();
      return;
    }

    // Do not count the same obstacle twice
    obj.passed = true;
  }

  // Remove obstacles once passed
  objects = objects.filter(obj => {
    if (obj.type === "coin" && obj.y > 555) return false;
    if (obj.type !== "coin" && obj.y > 580) return false;
    return true;
  });
}

function endGame() {
  running = false;
  gameOver = true;

  if (score > best) {
    best = score;
    try {
      localStorage.setItem("anshuRunnerBest", best);
    } catch(e) {}
  }

  updateStats();
  draw();
  drawOverlay("GAME OVER", "Your score: " + score);
}

function update(dt) {
  frame++;

  score += Math.floor(speed * dt / 1000);
  speed = Math.min(12, 5 + score / 400);

  spawnTimer += dt;

  if (spawnTimer > Math.max(480, 1050 - speed * 45)) {
    spawnObjects();
    spawnTimer = 0;
  }

  objects.forEach(obj => {
    obj.y += speed * dt / 16.67;
  });

  if (jumping) {
    jumpTime += dt;
    const t = jumpTime / 700;

    playerY = 125 * Math.sin(Math.PI * Math.min(t, 1));

    if (t >= 1) {
      jumping = false;
      playerY = 0;
    }
  }

  if (sliding) {
    slideTime += dt;

    if (slideTime >= 650) {
      sliding = false;
    }
  }

  collisionCheck();
  updateStats();
}

function draw() {
  drawBackground();
  drawObjects();
  drawPlayer();
}

function loop(time) {
  if (!running) return;

  const dt = Math.min(time - lastTime, 35);
  lastTime = time;

  update(dt);
  draw();

  if (running) {
    requestAnimationFrame(loop);
  }
}

function pauseGame() {
  if (!running) return;
  running = false;
  draw();
  drawOverlay("PAUSED", "Take a short break!");
}

$("start").addEventListener("click", resetGame);
$("pause").addEventListener("click", pauseGame);

$("left").addEventListener("click", moveLeft);
$("right").addEventListener("click", moveRight);
$("jump").addEventListener("click", jump);
$("slide").addEventListener("click", slide);

// Keyboard controls
document.addEventListener("keydown", e => {
  if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key)) {
    e.preventDefault();
  }

  if (e.repeat) return;

  if (e.key === "ArrowLeft" || e.key === "a") moveLeft();
  if (e.key === "ArrowRight" || e.key === "d") moveRight();
  if (e.key === "ArrowUp" || e.key === "w" || e.key === " ") jump();
  if (e.key === "ArrowDown" || e.key === "s") slide();

  if (e.key.toLowerCase() === "p") pauseGame();
});

// Mobile swipe controls
let touchStartX = 0;
let touchStartY = 0;

canvas.addEventListener("touchstart", e => {
  const t = e.changedTouches[0];
  touchStartX = t.clientX;
  touchStartY = t.clientY;
}, {passive: true});

canvas.addEventListener("touchend", e => {
  const t = e.changedTouches[0];

  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;

  if (Math.max(Math.abs(dx), Math.abs(dy)) < 25) return;

  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 0) moveRight();
    else moveLeft();
  } else {
    if (dy < 0) jump();
    else slide();
  }
}, {passive: true});

// Initial screen
draw();
drawOverlay("SUBWAY RUNNER", "ANSHU GAMING");
</script>

</body>
</html>
